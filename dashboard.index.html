<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;padding:24px}
h1{font-size:20px;font-weight:500;margin-bottom:4px}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;height:34px}
button{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer}
.last-update{font-size:11px;color:#888;display:block;margin-bottom:1rem}
.section-label{font-size:11px;font-weight:500;color:#999;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.75rem;margin-top:1.25rem}
.loading{text-align:center;padding:3rem;color:#888;font-size:14px}
.error{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:1rem;font-size:13px;color:#dc2626;margin-bottom:1rem}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:700px){.kpi-grid{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border-radius:10px;padding:1rem;border:1px solid #e8e8e5}
.kpi-label{font-size:11px;color:#888;margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:500;line-height:1.1}
.kpi-sub{font-size:11px;color:#aaa;margin-top:3px}
.progress-wrap{margin-top:8px}
.progress-labels{display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-bottom:3px}
.progress-bar{height:5px;background:#eee;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;padding:1rem 1.25rem}
.card-title{font-size:13px;font-weight:500;margin-bottom:.75rem}
.chart-wrap{position:relative;width:100%;height:200px}
.legend{display:flex;gap:14px;margin-bottom:8px;font-size:11px;color:#666;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.ldot{width:10px;height:10px;border-radius:2px}
.creatives-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:1.5rem}
.creative-card{background:#fff;border:1px solid #e8e8e5;border-radius:12px;overflow:hidden}
.creative-thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f5f5f3}
.creative-thumb-placeholder{width:100%;aspect-ratio:1/1;background:#f5f5f3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.creative-body{padding:.75rem}
.creative-name{font-size:12px;font-weight:500;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.creative-metrics{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cm{font-size:11px;color:#888}
.cm strong{color:#1a1a1a;font-weight:500}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;margin-top:6px}
.pill-green{background:#EAF3DE;color:#3B6D11}
.pill-amber{background:#FAEEDA;color:#854F0B}
.pill-red{background:#FCEBEB;color:#A32D2D}
.acct-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:99px;margin-bottom:4px}
</style>
</head>
<body>

<div class="top-bar">
  <h1>Performance dashboard</h1>
  <div class="controls">
    <select id="accountSelect" onchange="render()">
      <option value="all">Todas las cuentas</option>
      <option value="ALAC USA">ALAC USA</option>
      <option value="ALAC ARG">ALAC ARG</option>
    </select>
    <select id="monthSelect" onchange="render()"></select>
    <button onclick="loadData()">↻ Actualizar</button>
  </div>
</div>
<span class="last-update" id="lastUpdate"></span>

<div id="loadingMsg" class="loading">Cargando datos desde Google Sheets...</div>
<div id="errorMsg" style="display:none"></div>
<div id="mainContent" style="display:none">
  <p class="section-label">Resumen del período</p>
  <div class="kpi-grid" id="kpiGrid"></div>
  <p class="section-label">Evolución mensual</p>
  <div class="charts-grid">
    <div class="card">
      <div class="card-title">Spend mensual</div>
      <div class="legend" id="spendLegend"></div>
      <div class="chart-wrap"><canvas id="spendChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Conv. value mensual</div>
      <div class="legend" id="convLegend"></div>
      <div class="chart-wrap"><canvas id="convChart"></canvas></div>
    </div>
  </div>
  <p class="section-label">Top creativos del período</p>
  <div class="creatives-grid" id="creativesGrid"></div>
</div>

<script>
const SHEET_ID    = '1vQjPucxH2e78xUbkPdPZlvrOOjskKF1kJ6OLbuC0dIw';
const GID_RESUMEN = '338217484';
const GID_MONTHLY = '1743417792';
const COLORS = {'ALAC USA':'#185FA5','ALAC ARG':'#0F6E56',all:'#534AB7'};

let resumenRaw=[], monthlyRaw=[], spendChart, convChart;

const R={acct:1,ds:2,gran:4,spend:5,cv:16,purch:15,roas:17};
const M={acct:1,ds:2,adName:6,spend:8,roas:20,hook:21,hold:22,thumb:23};

async function fetchSheet(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} — verificá que la hoja sea pública`);
  const text = await resp.text();
  return parseCSV(text);
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const row = [];
    let cur='', inQ=false;
    for (let i=0; i<line.length; i++) {
      const c=line[i];
      if (c==='"') inQ=!inQ;
      else if (c===',' && !inQ) { row.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    row.push(cur.trim());
    rows.push(row);
  }
  return rows;
}

async function loadData() {
  document.getElementById('loadingMsg').style.display='block';
  document.getElementById('mainContent').style.display='none';
  document.getElementById('errorMsg').style.display='none';
  try {
    const [r1,r2] = await Promise.all([fetchSheet(GID_RESUMEN), fetchSheet(GID_MONTHLY)]);
    resumenRaw=r1.slice(1);
    monthlyRaw=r2.slice(1);
    populateMonths();
    document.getElementById('loadingMsg').style.display='none';
    document.getElementById('mainContent').style.display='block';
    document.getElementById('lastUpdate').textContent='Actualizado: '+new Date().toLocaleString('es-AR');
    render();
  } catch(e) {
    document.getElementById('loadingMsg').style.display='none';
    const err=document.getElementById('errorMsg');
    err.style.display='block';
    err.className='error';
    err.textContent='Error: '+e.message;
  }
}

function isMonthly(r) {
  const g=String(r[R.gran]).toLowerCase();
  return g.includes('mensual')||g.includes('monthly');
}

function populateMonths() {
  const months=[...new Set(resumenRaw.filter(isMonthly).map(r=>String(r[R.ds]).substring(0,7)).filter(m=>m.match(/^\d{4}-\d{2}$/)))].sort().reverse();
  const sel=document.getElementById('monthSelect');
  if(!months.length){sel.innerHTML='<option>Sin datos</option>';return;}
  sel.innerHTML=months.map(m=>{
    const [y,mo]=m.split('-');
    const label=new Date(y,mo-1).toLocaleString('es-AR',{month:'long',year:'numeric'});
    return `<option value="${m}">${label.charAt(0).toUpperCase()+label.slice(1)}</option>`;
  }).join('');
}

function render() {
  const acc=document.getElementById('accountSelect').value;
  const month=document.getElementById('monthSelect').value;
  if(!month)return;

  const rows=resumenRaw.filter(r=>(acc==='all'||r[R.acct]===acc)&&String(r[R.ds]).startsWith(month)&&isMonthly(r));
  const sum=col=>rows.reduce((a,r)=>a+(parseFloat(r[col])||0),0);
  const spend=sum(R.spend), cv=sum(R.cv), purch=sum(R.purch);
  const roas=spend>0?cv/spend:0, cpa=purch>0?spend/purch:0;

  const today=new Date();
  const isNow=month===today.toISOString().substring(0,7);
  const dom=today.getDate();
  const dim=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const projected=isNow?Math.round(spend+(spend/dom)*(dim-dom)):spend;
  const budget=acc==='ALAC USA'?12000:acc==='ALAC ARG'?4500:16500;
  const color=COLORS[acc]||COLORS.all;
  const bp=Math.min(spend/budget,1), pp=Math.min(projected/budget,1);

  document.getElementById('kpiGrid').innerHTML=`
    <div class="kpi">
      <div class="kpi-label">Spend del mes</div>
      <div class="kpi-value">${fmt(spend)}</div>
      <div class="progress-wrap">
        <div class="progress-labels"><span>${pct(bp)} del budget</span><span>${fmt(budget)}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${bp*100}%;background:${color}"></div></div>
      </div>
    </div>
    <div class="kpi">
      <div class="kpi-label">${isNow?'Proyectado fin de mes':'Total mes'}</div>
      <div class="kpi-value">${fmt(projected)}</div>
      <div class="kpi-sub">${isNow?'Ritmo '+dom+'d · '+pct(pp)+' del budget':'Mes cerrado'}</div>
      ${isNow?`<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(pp*100,100)}%;background:${projected>budget?'#dc2626':color}"></div></div></div>`:''}
    </div>
    <div class="kpi">
      <div class="kpi-label">ROAS</div>
      <div class="kpi-value">${roas.toFixed(2)}x</div>
      <div class="kpi-sub">${fmt(cv)} conv. value</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">CPA</div>
      <div class="kpi-value">${fmt(cpa)}</div>
      <div class="kpi-sub">${Math.round(purch)} compras</div>
    </div>`;

  renderCharts(acc);
  renderCreatives(acc,month);
}

function renderCharts(acc) {
  const accounts=acc==='all'?['ALAC USA','ALAC ARG']:[acc];
  const allMonths=[...new Set(resumenRaw.filter(isMonthly).map(r=>String(r[R.ds]).substring(0,7)).filter(m=>m.match(/^\d{4}-\d{2}$/)))].sort();
  const labels=allMonths.map(m=>{const [y,mo]=m.split('-');return new Date(y,mo-1).toLocaleString('es-AR',{month:'short',year:'2-digit'});});

  const spendDs=accounts.map(a=>({
    label:a,
    data:allMonths.map(m=>resumenRaw.filter(r=>r[R.acct]===a&&isMonthly(r)&&String(r[R.ds]).startsWith(m)).reduce((s,r)=>s+(parseFloat(r[R.spend])||0),0)),
    borderColor:COLORS[a],backgroundColor:COLORS[a]+'18',fill:true,tension:.35,pointRadius:3,borderWidth:1.5
  }));
  const convDs=accounts.map(a=>({
    label:a,
    data:allMonths.map(m=>resumenRaw.filter(r=>r[R.acct]===a&&isMonthly(r)&&String(r[R.ds]).startsWith(m)).reduce((s,r)=>s+(parseFloat(r[R.cv])||0),0)),
    backgroundColor:COLORS[a],borderRadius:3,barThickness:acc==='all'?10:18
  }));

  document.getElementById('spendLegend').innerHTML=accounts.map(a=>`<span><span class="ldot" style="background:${COLORS[a]}"></span>${a}</span>`).join('');
  document.getElementById('convLegend').innerHTML=accounts.map(a=>`<span><span class="ldot" style="background:${COLORS[a]}"></span>${a}</span>`).join('');

  const axisY={grid:{color:'rgba(0,0,0,.06)'},ticks:{color:'#888',font:{size:10},callback:v=>'$'+Math.round(v).toLocaleString()}};
  const axisX={grid:{display:false},ticks:{color:'#888',font:{size:10},maxRotation:45}};
  const plug={legend:{display:false},tooltip:{mode:'index',intersect:false}};

  if(spendChart)spendChart.destroy();
  if(convChart)convChart.destroy();
  spendChart=new Chart(document.getElementById('spendChart'),{type:'line',data:{labels,datasets:spendDs},options:{responsive:true,maintainAspectRatio:false,plugins:plug,scales:{x:axisX,y:axisY}}});
  convChart=new Chart(document.getElementById('convChart'),{type:'bar',data:{labels,datasets:convDs},options:{responsive:true,maintainAspectRatio:false,plugins:plug,scales:{x:axisX,y:axisY}}});
}

function renderCreatives(acc,month) {
  const filtered=monthlyRaw.filter(r=>(acc==='all'||r[M.acct]===acc)&&String(r[M.ds]).startsWith(month)&&(parseFloat(r[M.spend])||0)>0);
  const top=filtered.sort((a,b)=>(parseFloat(b[M.spend])||0)-(parseFloat(a[M.spend])||0)).slice(0,10);
  if(!top.length){document.getElementById('creativesGrid').innerHTML='<p style="font-size:13px;color:#888">No hay creativos para este período.</p>';return;}
  document.getElementById('creativesGrid').innerHTML=top.map(c=>{
    const spend=parseFloat(c[M.spend])||0, roas=parseFloat(c[M.roas])||0;
    const hook=parseFloat(c[M.hook])||0, hold=parseFloat(c[M.hold])||0;
    const thumb=c[M.thumb]||'', acct=c[M.acct]||'', color=COLORS[acct]||'#888';
    const status=roas>=3.5?'top':roas>=2.5?'bueno':roas>=1.5?'regular':'bajo';
    const pillClass={top:'pill-green',bueno:'pill-green',regular:'pill-amber',bajo:'pill-red'}[status];
    const imgHTML=thumb
      ?`<img class="creative-thumb" src="${thumb}" alt="ad" onerror="this.outerHTML='<div class=creative-thumb-placeholder><span style=font-size:11px;color:#aaa>sin imagen</span></div>'">`
      :`<div class="creative-thumb-placeholder"><span style="font-size:11px;color:#aaa">sin thumbnail</span></div>`;
    return `<div class="creative-card">${imgHTML}<div class="creative-body"><div class="acct-tag" style="background:${color}18;color:${color}">${acct}</div><div class="creative-name" title="${c[M.adName]}">${c[M.adName]||'Sin nombre'}</div><div class="creative-metrics"><div class="cm"><strong>${fmt(spend)}</strong><br>spend</div><div class="cm"><strong>${roas.toFixed(1)}x</strong><br>ROAS</div><div class="cm"><strong>${hook.toFixed(1)}%</strong><br>hook</div><div class="cm"><strong>${hold.toFixed(1)}%</strong><br>hold</div></div><span class="pill ${pillClass}">${status}</span></div></div>`;
  }).join('');
}

function fmt(n){return'$'+(Math.round(n)||0).toLocaleString('en-US')}
function pct(n){return Math.round((n||0)*100)+'%'}

loadData();
</script>
</body>
</html>
